<!DOCTYPE html>
<!-- REVUE DE CODE — Exercice 4 : Gestion d'événements HTML -->
<!-- ✅ BIEN : Utilise lang="fr" — important pour l'accessibilité. -->
<!-- ⚠️ SUGGESTION : Ajoutez <meta charset="UTF-8"> dans <head>. -->
<!-- ⚠️ SUGGESTION : Ajoutez <meta name="viewport"> pour la réactivité mobile. -->
<!-- ✅ BIEN : Le JS est chargé via <script src> à la fin du <body> (pas dans <head>),
     ce qui garantit que le DOM est prêt avant l'exécution du script. -->
<html lang="fr">

<head>
    <title>Gestion d'événements en JavaScript</title>
</head>

<body>

<button id="myButton">Cliquez ici</button>

<script src="./index.js"></script>
</body>

</html>
