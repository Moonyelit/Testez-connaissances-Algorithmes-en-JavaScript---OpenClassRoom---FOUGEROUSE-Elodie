<!DOCTYPE html>
<html lang="fr">
<head>
    <title>Page avec Accessibilité</title>
</head>
<body>
<h1>Titre de la Page</h1>
<p>Ceci est un paragraphe de texte.</p>

<form aria-label="Formulaire de contact">
    <label for="name">Nom</label>
    <input id="name" type="text" placeholder="Entrez votre nom" aria-required="true">

    <label for="email">Adresse e-mail</label>
    <input id="email" type="email" placeholder="Entrez votre adresse e-mail" aria-required="true">

    <button type="submit" aria-label="Envoyer le formulaire de contact">Envoyer</button>
</form>

<img src="assets/image.png" height="250" alt="Image illustrative de la page" aria-hidden="false">

<a href="#" title="Lien vers la page d'accueil" aria-label="Lien vers la page d'accueil">Cliquez ici</a>
</body>
</html>
